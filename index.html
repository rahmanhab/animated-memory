<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agency Books</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Books">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
input,select,button{font-size:16px}
.mo{display:none}
@media(max-width:700px){.w{padding:14px 12px 80px}.hm{display:none}.mo{display:block}table{min-width:0}.v{font-size:19px}button{min-height:42px}.bar button{flex:1}form{grid-template-columns:1fr 1fr}#f>div:nth-child(3),#f>div:nth-child(5),#f>div:last-child{grid-column:1/-1}}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--bd:#e2e0d8;--ac:#1f5f4a;--in:#1f7a4d;--out:#b3402a;--pend:#b7791f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151514;--card:#201f1d;--tx:#efeee9;--mut:#9a988f;--bd:#34332f;--ac:#5cc0a0;--in:#5cc08a;--out:#e8836d;--pend:#e0b04f}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sub{color:var(--mut);font-size:13px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.k{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.v{font-size:22px;font-weight:650;margin-top:4px}
.in{color:var(--in)}.out{color:var(--out)}.pend{color:var(--pend)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--tx);border:1px solid var(--bd);font-weight:500}
button.x{background:none;color:var(--out);padding:2px 6px;font-size:18px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.bar>*{width:auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;color:var(--mut);font-size:12px;font-weight:500;padding:8px;border-bottom:1px solid var(--bd)}
td{padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);cursor:pointer}
.m{margin:14px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.m{grid-template-columns:1fr}}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border:0}
#msg{color:var(--mut);padding:30px;text-align:center}
#lg{position:fixed;inset:0;background:var(--bg);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}#lg .c{width:100%;max-width:360px}#lg input{margin-bottom:10px}#lg button{width:100%}#lgm{color:var(--out);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div id="lg"><div class="c"><h1>Agency Books</h1><div class="sub" style="margin:4px 0 14px">Sign in with your partner account</div>
<input id="em" type="email" placeholder="Email" autocomplete="username"><input id="pw" type="password" placeholder="Password" autocomplete="current-password">
<button id="li">Sign in</button><div id="lgm"></div></div></div>
<div class="w">
  <div class="top">
    <div><h1>Agency Books</h1><div class="sub" id="who"></div></div>
    <div class="bar" style="margin:0"><button class="s" id="nm">Set my name</button><button class="s" id="imp">Import backup</button><button class="s" id="bak">Save backup</button><button class="s" id="so" style="display:none">Sign out</button><button class="s" id="csv">Export CSV</button><input type="file" id="file" accept=".json" style="display:none"></div>
  </div>

  <div class="g">
    <div class="c"><div class="k">Income (paid)</div><div class="v in" id="kIn">–</div></div>
    <div class="c"><div class="k">Expenses (paid)</div><div class="v out" id="kOut">–</div></div>
    <div class="c"><div class="k">Net profit</div><div class="v" id="kNet">–</div></div>
    <div class="c"><div class="k">Receivable (unpaid)</div><div class="v pend" id="kRec">–</div></div>
    <div class="c"><div class="k">Payable (unpaid)</div><div class="v pend" id="kPay">–</div></div>
  </div>

  <div class="c" style="margin-bottom:16px">
    <h2>Add entry</h2>
    <form id="f">
      <div><label>Type</label><select id="type"><option value="income">Income / Invoice</option><option value="expense">Expense</option></select></div>
      <div><label>Date</label><input type="date" id="date" required></div>
      <div><label>Client / Vendor</label><input id="party" placeholder="e.g. Acme Pvt Ltd" required></div>
      <div><label>Category</label><select id="cat"></select></div>
      <div><label>Description</label><input id="desc" placeholder="Optional"></div>
      <div><label>Amount (₹)</label><input type="number" id="amt" min="0" step="0.01" required></div>
      <div><label>Status</label><select id="status"><option value="paid">Paid</option><option value="unpaid">Unpaid</option></select></div>
      <div><button type="submit">Add</button></div>
    </form>
  </div>

  <div class="c">
    <h2>Transactions</h2>
    <div class="bar">
      <select id="fType"><option value="">All types</option><option value="income">Income</option><option value="expense">Expense</option></select>
      <select id="fStatus"><option value="">Any status</option><option value="paid">Paid</option><option value="unpaid">Unpaid</option></select>
      <input id="fMonth" type="month" title="Month">
      <input id="fQ" placeholder="Search…" style="min-width:160px">
    </div>
    <div class="tw"><table>
      <thead><tr><th>Date</th><th>Client / Vendor</th><th class="hm">Category</th><th class="hm">Added by</th><th>Status</th><th class="n">Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <div id="msg">Loading…</div>
  </div>

  <div class="m">
    <div class="c"><h2>Income by client</h2><div id="byClient"></div></div>
    <div class="c"><h2>Expenses by category</h2><div id="byCat"></div></div>
  </div>
</div>

<script>
const CATS={income:["Retainer","Project","Ad management","SEO","Content / Design","Other income"],
  expense:["Ad spend (pass-through)","Salaries","Freelancers","Software / Tools","Rent / Utilities","Marketing","Taxes / GST","Other"]};
const $=id=>document.getElementById(id);
const fmt=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const KEY="agencyBooks.v1",NK="agencyBooks.name";
let tx=[];try{tx=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
let myName="";try{myName=localStorage.getItem(NK)||""}catch(e){}
let col=null;
function save(){if(!col){try{localStorage.setItem(KEY,JSON.stringify(tx))}catch(e){alert("Could not save in this browser.")}}render()}
async function put(x){if(col){try{await col.doc(x.id).set(x)}catch(e){alert("Could not save to cloud: "+(e.message||e.code))}}else{tx.push(x);save()}}
async function del(id){if(col){try{await col.doc(id).delete()}catch(e){alert("Not allowed: "+(e.message||e.code))}}else{tx=tx.filter(x=>x.id!==id);save()}}
function who(){$("who").textContent=(col?"☁ Shared cloud ledger · live for everyone with access · ":"Offline copy (not shared) · ")+(myName?"working as "+myName:"click “Set my name”")}
$("nm").onclick=()=>{const n=prompt("Your name (e.g. Priya):",myName);if(n!==null){myName=n.trim();try{localStorage.setItem(NK,myName)}catch(e){}who()}};
function fillCats(){$("cat").innerHTML=CATS[$("type").value].map(c=>`<option>${c}</option>`).join("")}
$("type").onchange=fillCats;fillCats();
$("date").value=new Date().toISOString().slice(0,10);
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function filtered(){
  const t=$("fType").value,s=$("fStatus").value,m=$("fMonth").value,q=$("fQ").value.toLowerCase();
  return tx.filter(x=>(!t||x.type===t)&&(!s||x.status===s)&&(!m||x.date.startsWith(m))&&
    (!q||(x.party+" "+x.cat+" "+x.desc).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||(b.created||0)-(a.created||0));
}
function sum(l,type,st){return l.filter(x=>x.type===type&&(!st||x.status===st)).reduce((a,x)=>a+x.amount,0)}
function group(l,k){const o={};l.forEach(x=>o[x[k]]=(o[x[k]]||0)+x.amount);return Object.entries(o).sort((a,b)=>b[1]-a[1])}
function render(){
  const list=filtered();
  const inc=sum(list,"income","paid"),exp=sum(list,"expense","paid");
  $("kIn").textContent=fmt(inc);$("kOut").textContent=fmt(exp);
  const net=inc-exp;$("kNet").textContent=fmt(net);$("kNet").className="v "+(net>=0?"in":"out");
  $("kRec").textContent=fmt(sum(list,"income","unpaid"));$("kPay").textContent=fmt(sum(list,"expense","unpaid"));
  $("rows").innerHTML=list.map(x=>`<tr><td>${esc(x.date)}</td>
    <td>${esc(x.party)}${x.desc?`<div class="sub">${esc(x.desc)}</div>`:""}<div class="sub mo">${esc(x.cat)}${x.by?" · "+esc(x.by):""}</div></td><td class="hm">${esc(x.cat)}</td>
    <td class="sub hm">${esc(x.by||"–")}</td>
    <td><span class="tag ${x.status==="paid"?"in":"pend"}" data-t="${x.id}">${x.status}</span></td>
    <td class="n ${x.type==="income"?"in":"out"}">${x.type==="income"?"+":"−"}${fmt(x.amount)}</td>
    <td><button class="x" data-d="${x.id}" title="Delete">×</button></td></tr>`).join("");
  $("msg").style.display=list.length?"none":"block";
  $("msg").textContent=tx.length?"No entries match the filters.":"No entries yet — add your first one above.";
  const cl=group(list.filter(x=>x.type==="income"&&x.status==="paid"),"party");
  $("byClient").innerHTML=cl.length?cl.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join(""):'<div class="sub">No paid income yet</div>';
  const ca=group(list.filter(x=>x.type==="expense"&&x.status==="paid"),"cat");
  $("byCat").innerHTML=ca.length?ca.map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join(""):'<div class="sub">No paid expenses yet</div>';
}
["fType","fStatus","fMonth","fQ"].forEach(id=>$(id).oninput=render);
$("f").onsubmit=e=>{e.preventDefault();
  put({id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:$("type").value,date:$("date").value,
    party:$("party").value.trim(),cat:$("cat").value,desc:$("desc").value.trim(),amount:parseFloat($("amt").value),
    status:$("status").value,by:myName,created:Date.now()});
  $("party").value="";$("desc").value="";$("amt").value=""};
$("rows").onclick=e=>{const t=e.target.dataset;
  if(t.d&&confirm("Delete this entry?"))del(t.d);
  if(t.t){const x=tx.find(y=>y.id===t.t);const ns=x.status==="paid"?"unpaid":"paid";if(col)col.doc(x.id).update({status:ns}).catch(()=>alert("Not allowed to edit."));else{x.status=ns;save()}}};
function dl(name,text,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
$("csv").onclick=()=>{const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  dl("agency-books.csv",["Date,Type,Client/Vendor,Category,Description,Amount,Status,Added by"].concat(filtered().map(x=>[x.date,x.type,q(x.party),q(x.cat),q(x.desc),x.amount,x.status,q(x.by)].join(","))).join("\n"),"text/csv")};
$("bak").onclick=()=>dl("agency-books-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify(tx),"application/json");
$("imp").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;
  try{const inc=JSON.parse(await f.text());const have=new Set(tx.map(x=>x.id));let n=0;
    inc.forEach(x=>{if(x&&x.id&&!have.has(x.id)&&x.date&&x.amount>=0){put(x);n++}});
    save();alert(n+" new entries merged.")}catch(err){alert("That file isn't a valid backup.")}
  e.target.value=""};
window.cloudOn=a=>{col=a;who()};
window.cloudData=a=>{tx=a;render()};
window.cloudOff=()=>{col=null;try{tx=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){tx=[]}who();render()};
window.setMe=n=>{if(!myName){myName=n;who()}};
who();render();
if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module">
import {SUPABASE_URL,SUPABASE_KEY} from "./supabase-config.js";
const g=id=>document.getElementById(id),CK="agencyBooks.cloudcache";
const toRow=x=>({id:x.id,type:x.type,date:x.date,party:x.party,cat:x.cat,descr:x.desc||"",amount:x.amount,status:x.status,by_name:x.by||"",created:x.created||Date.now()});
const fromRow=r=>({id:r.id,type:r.type,date:r.date,party:r.party,cat:r.cat,desc:r.descr||"",amount:Number(r.amount),status:r.status,by:r.by_name||"",created:Number(r.created)});
if(!window.supabase){g("who").textContent="Could not load the sync library. Check your internet."}
else{
 const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 async function refresh(){
  const {data,error}=await sb.from("transactions").select("*");
  if(error){g("who").textContent="Offline or can't read ledger: "+error.message;
   try{cloudData(JSON.parse(localStorage.getItem(CK)||"[]"))}catch(e){}return}
  const a=data.map(fromRow);try{localStorage.setItem(CK,JSON.stringify(a))}catch(e){}cloudData(a)}
 const wrap=async p=>{const {error}=await p;if(error)alert("Could not save: "+error.message);await refresh()};
 cloudOn({doc:id=>({set:x=>wrap(sb.from("transactions").upsert(toRow(x))),update:x=>wrap(sb.from("transactions").update(x).eq("id",id)),delete:()=>wrap(sb.from("transactions").delete().eq("id",id))})});
 refresh();
 sb.channel("tx-live").on("postgres_changes",{event:"*",schema:"public",table:"transactions"},refresh).subscribe();
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
 try{if(!localStorage.getItem("agencyBooks.name"))setTimeout(()=>g("nm").click(),400)}catch(e){}
}
</script>
</body>
</html>
